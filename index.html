/* clean board theme */
:root{--line:#eceff4;--ink:#323338;--muted:#8a93a3}
main{background:#fff}
#summary{margin-bottom:10px}
.toolbar,.secondary{gap:6px}
.toolbar button,.toolbar select,.secondary button{border-color:transparent;background:#f3f4f7;border-radius:6px;color:#4b5567}
.toolbar button:hover,.secondary button:hover{background:#e9ebf1;border-color:transparent}
.toolbar .primary{background:var(--purple);color:#fff}.toolbar .primary:hover{background:#6141c3}

.toolbar input:focus{background:#fff;border-color:#c9bdf2;outline:none}
.secondary{border-bottom:0}
.board{border:0;border-radius:0;background:#fff}
.row{border-bottom:1px solid var(--line)}
.label{border-right:1px solid var(--line)}

.monthHeaders{background:#fff}.monthHeader{color:var(--ink);font-weight:600}.submonthTick{background:#fff;color:var(--muted);font-weight:500}
.track{background-image:linear-gradient(to right,#f1f3f7 1px,transparent 1px)}
.row.group{background:#fff;height:46px;border-bottom:1px solid var(--line)}
.row.group .label{background:#fff;padding-top:8px}
.row.group .text strong{color:var(--g);font-size:15px;font-weight:600}
.row.group .chev{border-color:transparent transparent transparent var(--g)}
.row.group .groupSpan{top:21px;height:8px;border-radius:4px;background:var(--g);opacity:.35}
.row.group .bar{top:10px}.row.group .bar.milestone{top:13px}

.row.group:hover .label button{opacity:1}
.row.task .label{background:#f7f8fa;box-shadow:inset 6px 0 0 var(--tc,var(--g));padding-left:12px}
.row.task:hover .label{background:#eef0f6}
.row.task .text strong{color:var(--ink);font-weight:400;font-size:13px}
.label small{color:var(--muted)}
.row.addRow{height:34px}
.row.addRow .label{background:#fff;box-shadow:inset 5px 0 0 color-mix(in srgb,var(--g) 40%,white);padding-left:12px}
.row.addRow .label button{color:var(--muted);font-size:12px;padding:4px 6px}
.row.addRow .label button:hover{color:var(--ink);background:#f3f4f7}

$('#help').onclick=()=>{showDialog('help','使用說明',`<div class="helpText"><p>建立專案 → 群組 → 任務。開始日期留空為未排程；有開始但無結束為里程碑。專案時間範圍依任務與顯示中的基準自動計算。</p><p>週日到週六一週，含 1/1 的週為當年第一週；跨年於 1/1 分段。2026/1/1–1/3 是 W601，1/4–1/10 是 W602。旬上層月份 M611，下層 B（1–10）、M（11–20）、E（21–月底）。月份 M601–M612，季 26Q1–26Q4；完整年份在表頭或提示中。</p><p>拖曳群組的 ⋮⋮ 排序群組；按住任務列直接拖曳可排序並跨群組，點擊任務列即編輯。色條拖曳平移，兩端拖曳調整起訖；點名稱或雙擊色條編輯。收合群組將所有色條放在同一列。重疊色條請展開檢視。</p><p>相依為完成後開始，支援多前置與跨群組；循環會拒絕。自動順延只推遲、不自動提早；未排程任務不會被自動填日期。關閉自動順延可保留日期並查看提醒。</p><p>保存基準記錄當下排程，灰線對照原訂計畫，名稱下顯示完工差異天數。新增任務無基準；可再次保存覆寫並復原。複製或從範本建立會重設進度與基準，可指定新起點。</p><p>勾選任務後批次改期、負責人、狀態、進度、顏色、群組或刪除。工作日模式會跳過週末／假日，既有日期不會因切換模式全部改動。日視圖陰影顯示非工作日。</p><p>工作量跨全部專案，依任務每日投入 h 計算，排除完成與暫停。紅框代表週中至少一天超出每日容量，即使整週時數未超載也會提醒。</p><p>Excel 為真正 .xlsx，含任務、基準、前置與工作量明細。PNG 匯出目前圖表。篩選與收合會影響圖表，Excel 則匯出目前專案（總覽為全部）的完整任務。</p><p>資料自動存在此瀏覽器。連結本機 JSON 後，本次開啟期間每次變更也會同步；重新開啟頁面需再按「開啟本機檔案」。不支援檔案 API 的瀏覽器會改用下載／上傳。JSON 備份包含專案、範本、工作日及基準；匯入合併不覆蓋，開啟檔案則取代工作區。請勿多分頁同時編輯。最近 60 次操作可復原，重新整理後不保留操作歷史。</p><p>日期支援 1900–2199，時間軸過長會自動改成較粗尺度。不含雲端同步或多人即時協作。</p></div>`);$('#submit').style.display='none';};
window.addEventListener('storage',e=>{if(e.key===KEY)toast('其他分頁已更新工作區，請先備份並重新整理，避免同時編輯。');});window.addEventListener('beforeunload',e=>{if((fileTimer&&fileHandle)||pendingWrites){e.preventDefault();e.returnValue='';}});
if(['overview','workload'].includes(active))view=active;render();if(loadError)toast('既有資料讀取失敗，原始內容未覆寫；請開啟有效 JSON 備份。');

</script></body></html>
