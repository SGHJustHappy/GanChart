<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow｜專案甘特圖</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand">◈ GChart <small>輕量專案規劃</small></div><button id="overview">▦ 多專案總覽</button><button id="workload">◷ 負責人工作量</button><button id="newProject" class="primary">＋ 新增專案</button><button id="templates">從範本建立</button><input id="projectSearch" placeholder="搜尋專案…"><nav id="projects"></nav><footer><button id="saveFile">連結 / 另存本機檔案</button><button id="openFile">開啟本機檔案</button><button id="export">↓ 備份全部 JSON</button><button id="import">↑ 合併匯入 JSON</button><input type="file" id="file" accept="application/json" hidden><p id="saveState">資料儲存在此瀏覽器</p><p id="fileState"></p><button id="settings">工作日與假日設定</button><button id="help">使用說明</button></footer></aside>
<main><header><div><small class="eyebrow">PROJECT WORKSPACE</small><div class="titleRow"><h1 id="title"></h1><button id="rename" class="iconBtn" title="編輯專案">✏️</button></div><p id="summary"></p></div><div class="actions"><button id="duplicate">複製 / 套用日期</button><button id="saveTemplate">存為範本</button><button id="deleteProject" class="danger">刪除</button></div></header>
<section class="toolbar"><button id="addGroup">＋ 群組</button><button id="addTask" class="primary">＋ 任務</button><select id="scale" aria-label="時間尺度"><option value="week">週 Week</option><option value="submonth">旬 B / M / E</option><option value="month">月 Month</option><option value="quarter">季 Quarter</option><option value="day">日 Day</option></select><button id="zoomOut" title="縮小">−</button><button id="zoomIn" title="放大">＋</button><button id="today">今天</button><button id="collapse">▸ 收合</button><button id="expand">▾ 展開</button><button id="undo" title="Ctrl+Z">復原</button><button id="redo">重做</button><input id="search" placeholder="搜尋任務、負責人…"><select id="statusFilter"><option value="">全部狀態</option><option>未開始</option><option>進行中</option><option>已完成</option><option>暫停</option></select></section>
<section class="toolbar secondary"><button id="baseline">保存基準計畫</button><label><input type="checkbox" id="showBaseline"> 顯示基準</label><button id="reschedule">依相依關係排程</button><button id="selectAll">選取可見任務</button><button id="batch">批次操作 <span id="selectionCount"></span></button><button id="clearSelection">取消選取</button><span class="spacer"></span><button id="exportExcel">Excel</button><button id="exportImage">圖片 PNG</button></section>
<div id="alerts"></div><div id="special"></div><div id="empty" class="empty"></div><div class="board" id="board"><div id="grid"></div></div><div id="unscheduled"></div><div class="bottom"><span>◆ 里程碑 · ⋮⋮ 拖曳排序 · 色條兩端調整起訖 · 灰線為基準 · 相依為完成後開始</span><span id="range"></span></div></main>
<dialog id="editor"><form id="form"><h2 id="editorTitle"></h2><div id="fields"></div><div class="dialogActions"><button type="button" id="remove" class="danger">刪除</button><button type="button" id="cancel">取消</button><button type="submit" id="submit" class="primary">儲存</button></div></form></dialog><div id="toast" role="status"></div><script src="core.js"></script><script src="exports.js"></script><script src="app.js"></script></body></html>
